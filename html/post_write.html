<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 작성 - 아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/post_form.css">
</head>
<body>

  <!-- 헤더: 뒤로가기 왼쪽 + 타이틀 가운데 + 프로필 오른쪽 -->
  <header class="header header-with-back">
    <button class="back-btn" id="backBtn">&#10094;</button>
    <span class="header-title">아무 말 대잔치</span>
    <button id="profileBtn" style="
      position:absolute;
      right:475px;
      background:none;
      border:none;
      cursor:pointer;
      width:40px;
      height:40px;
      border-radius:50%;
      background-color:#C8C8C8;
      overflow:hidden;
      padding:0;
    ">
      <img id="profileImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
    </button>
    <div class="profile-dropdown" id="profileDropdown">
      <button class="dropdown-item" id="goProfileEdit">회원정보수정</button>
      <button class="dropdown-item" id="goPasswordEdit">비밀번호수정</button>
      <button class="dropdown-item" id="goLogout">로그아웃</button>
    </div>
  </header>

  <main class="main">

    <h1 class="page-title">게시글 작성</h1>

    <div class="write-form">

      <!-- ② 제목 -->
      <div class="field">
        <div class="field-label">제목<span class="required">*</span></div>
        <input
          type="text"
          id="postTitle"
          placeholder="제목을 입력해주세요. (최대 26글자)"
          maxlength="26"
        >
        <div class="helper-text" id="titleHelper"></div>
      </div>

      <!-- ③ 내용 -->
      <div class="field">
        <div class="field-label">내용<span class="required">*</span></div>
        <textarea
          class="content-textarea"
          id="postContent"
          placeholder="내용을 입력해주세요."
        ></textarea>
        <div class="helper-text" id="contentHelper"></div>
      </div>

      <!-- ④ 이미지 -->
      <div class="field">
        <div class="field-label">이미지</div>
        <div class="image-upload-row">
          <button class="image-upload-btn" id="imageUploadBtn">파일 선택</button>
          <span class="image-upload-placeholder" id="imageFileName">파일을 선택해주세요.</span>
        </div>
        <input type="file" id="imageUpload" accept="image/*" multiple style="display:none;">
      </div>

      <!-- ⑤ 완료 버튼 -->
      <div class="submit-wrap">
        <button class="btn-submit" id="submitBtn">완료</button>
      </div>
      <div class="helper-text" id="submitHelper">*제목, 내용을 모두 작성해주세요</div>

    </div>


    <!-- 임시저장 불러오기 모달 -->
    <div class="modal-overlay" id="tempModal" style="display:none;">
      <div class="modal-box">
        <div class="modal-title">이전에 작성 중인 글이 있습니다.</div>
        <div class="modal-desc">이어서 작성할까요?</div>
        <div class="modal-btns">
          <button class="btn-modal-cancel" id="tempModalCancel">취소</button>
          <button class="btn-modal-confirm" id="tempModalConfirm">확인</button>
        </div>
      </div>
    </div>

  </main>

  <script src="../js/common.js" type="module"></script>
  <script src="../js/post_write.js" type="module"></script>
</body>
</html>
