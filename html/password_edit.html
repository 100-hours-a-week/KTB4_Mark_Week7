<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호수정 - 아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/profile_edit.css">
  <link rel="stylesheet" href="../css/password_edit.css">
</head>
<body>

  <!-- 헤더 -->
  <header class="header" style="position:relative;">
    <span class="header-title">아무 말 대잔치</span>
    <button id="profileBtn" style="
      position:absolute; right:475px;
      background:none; border:none; cursor:pointer;
      width:40px; height:40px; border-radius:50%;
      background-color:#C8C8C8; overflow:hidden; padding:0;
    ">
      <img id="profileImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
    </button>
    <div class="profile-dropdown" id="profileDropdown">
      <button class="dropdown-item" id="goProfileEdit">회원정보수정</button>
      <button class="dropdown-item" id="goPasswordEdit">비밀번호수정</button>
      <button class="dropdown-item" id="goLogout">로그아웃</button>
    </div>
  </header>

  <main class="main password-page">

    <h1 class="page-title">비밀번호 수정</h1>

    <!-- ① 비밀번호 + 확인 -->
    <div class="card password-form-card">
      <div class="field">
        <div class="field-label">비밀번호</div>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요">
        <div class="helper-text" id="passwordHelper"></div>
      </div>
      <div class="field">
        <div class="field-label">비밀번호 확인</div>
        <input type="password" id="passwordConfirm" placeholder="비밀번호를 한번 더 입력하세요">
        <div class="helper-text" id="passwordConfirmHelper"></div>
      </div>
    </div>

    <!-- ② 수정하기 버튼 -->
    <div class="card password-btn-card">
      <button class="btn-primary" id="submitBtn">수정하기</button>
    </div>

  </main>

  <script src="../js/common.js" type="module"></script>
  <script src="../js/password_edit.js" type="module"></script>
</body>
</html>
