<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 목록 - CodeLounge</title>
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/post_list.css">
</head>
<body>

  <!-- 헤더: 타이틀 가운데 + 프로필 아이콘 오른쪽 고정 -->
  <header id="headerRoot" data-back="false" data-auth="true"></header>

  <main class="main">

    <div class="list-header">
      <!-- 인삿말: width 400, font 42dot Sans 24px -->
      <p class="list-greeting">안녕하세요, CodeLounge 게시판 입니다.</p>

      <div class="list-toolbar">
        <button class="category-toggle" id="categoryToggle">
          <span id="categoryToggleLabel">전체</span>
          <span class="category-toggle-arrow">▾</span>
        </button>

        <!-- ① 게시글 작성 버튼: 147 x 80 -->
        <button class="write-btn" id="writeBtn">게시글 작성</button>
      </div>

      <div class="category-chips" id="categoryChips">
        <span class="chip active">전체</span>
        <span class="chip">질문</span>
        <span class="chip">토론</span>
        <span class="chip">정보공유</span>
        <span class="chip">스터디모집</span>
        <span class="chip chip-muted">공지</span>
      </div>
    </div>

    <!-- ③ 게시글 목록 -->
    <div class="post-list" id="postList">
    </div>

    <!-- 빈 목록 (JS로 표시) -->
    <div class="empty-message" id="emptyMessage" style="display:none;">
      아직 게시글이 없어요. 첫 글을 작성해보세요!
    </div>

  </main>
  <script src="../js/header.js" type="module"></script>

  <script src="../js/common.js" type="module"></script>
  <script src="../js/post_list.js" type="module"></script>
</body>
</html>
