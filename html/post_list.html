<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 목록 - 아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/post_list.css">
</head>
<body>

  <!-- 헤더: 타이틀 가운데 + 프로필 아이콘 오른쪽 고정 -->
  <header class="header" style="position:relative;">
    <span class="header-title">아무 말 대잔치</span>
    <button id="profileBtn" style="
      position:absolute;
      right:475px;
      background:none;
      border:none;
      cursor:pointer;
      width:40px;
      height:40px;
      border-radius:50%;
      background-color:#C8C8C8;
      overflow:hidden;
      padding:0;
    ">
      <img id="profileImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
    </button>
    <div class="profile-dropdown" id="profileDropdown">
      <button class="dropdown-item" id="goProfileEdit">회원정보수정</button>
      <button class="dropdown-item" id="goPasswordEdit">비밀번호수정</button>
      <button class="dropdown-item" id="goLogout">로그아웃</button>
    </div>
  </header>

  <main class="main">

    <div class="list-header">
      <!-- 인삿말: width 400, font 42dot Sans 24px -->
      <p class="list-greeting">안녕하세요,<br>아무 말 대잔치 게시판 입니다.</p>

      <!-- ① 게시글 작성 버튼: 147 x 80 -->
      <button class="write-btn" id="writeBtn">게시글 작성</button>
    </div>

    <!-- ③ 게시글 목록 -->
    <div class="post-list" id="postList">
    </div>

    <!-- 빈 목록 (JS로 표시) -->
    <div class="empty-message" id="emptyMessage" style="display:none;">
      아직 게시글이 없어요. 첫 글을 작성해보세요!
    </div>

  </main>

  <script src="../js/common.js" type="module"></script>
  <script src="../js/post_list.js" type="module"></script>
</body>
</html>
