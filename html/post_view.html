<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 상세 - CodeLounge</title>
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/post_view.css">
</head>
<body>

  <!-- 헤더 -->
  <header id="headerRoot" data-back="true" data-auth="true"></header>

  <main class="main">
    <div class="view-wrap">

      <!-- 제목 -->
      <div class="post-view-title" id="postTitle">제목 1</div>

      <!-- 작성자 + 날짜 + 수정/삭제 -->
      <div class="post-view-meta">
        <div class="meta-avatar">
          <img src="" alt="" id="authorImg" style="display:none;">
        </div>
        <span class="meta-author" id="authorName">더미 작성자 1</span>
        <span class="meta-date" id="postDate">2021-01-01 00:00:00</span>
        <!-- JS로 본인글일 때만 보여주세요 -->
        <div class="meta-actions" id="postActions" style="display:none;">
          <button class="btn-edit" id="editBtn">수정</button>
          <button class="btn-delete" id="deletePostBtn">삭제</button>
        </div>
        <button class="btn-report" id="reportBtn">신고</button>
      </div>

      <div class="view-divider"></div>

      <!-- 이미지 (JS로 있을 때 display:block) -->
      <div class="post-view-image" id="postImage">
      </div>

      <!-- 본문 -->
      <div class="post-view-content" id="postContent">
        게시글 내용이 여기에 표시됩니다.
      </div>

      <!-- ③ 좋아요 / 조회수 / 댓글 -->
      <div class="post-view-stats">
        <div class="stat-box" id="likeBtn">
          <span class="stat-value" id="likeCount">123</span>
          <span class="stat-label">좋아요</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="viewCount">123</span>
          <span class="stat-label">조회수</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="commentCount">123</span>
          <span class="stat-label">댓글</span>
        </div>
      </div>

      <!-- ④ 댓글 입력 -->
      <div class="comment-input-wrap">
        <textarea
          class="comment-textarea"
          id="commentInput"
          placeholder="댓글을 남겨주세요!"
        ></textarea>
        <div class="comment-submit-row">
          <button class="btn-comment-submit" id="commentSubmitBtn">댓글 등록</button>
        </div>
      </div>

      <!-- ⑤ 댓글 목록 -->
      <div class="comment-list" id="commentList">

        <div class="comment-item">
          <div class="comment-meta">
            <div class="comment-avatar"></div>
            <span class="comment-author">더미 작성자 1</span>
            <span class="comment-date">2021-01-01 00:00:00</span>
            <!-- JS로 본인 댓글일 때만 보여주세요 -->
            <div class="comment-actions" id="commentActions1" style="display:none;">
              <button class="btn-comment-edit">수정</button>
              <button class="btn-comment-delete">삭제</button>
            </div>
          </div>
          <div class="comment-content">댓글 내용</div>
        </div>

        <div class="comment-item">
          <div class="comment-meta">
            <div class="comment-avatar"></div>
            <span class="comment-author">더미 작성자 1</span>
            <span class="comment-date">2021-01-01 00:00:00</span>
          </div>
          <div class="comment-content">댓글 내용</div>
        </div>

        <div class="comment-item">
          <div class="comment-meta">
            <div class="comment-avatar"></div>
            <span class="comment-author">더미 작성자 1</span>
            <span class="comment-date">2021-01-01 00:00:00</span>
          </div>
          <div class="comment-content">댓글 내용</div>
        </div>

      </div>

    </div>
  </main>

  <!-- 게시글 삭제 모달 (2-1) -->
  <div class="modal-overlay" id="deletePostModal">
    <div class="modal-box">
      <div class="modal-title">게시글을 삭제하시겠습니까?</div>
      <div class="modal-desc">삭제한 내용은 복구 할 수 없습니다.</div>
      <div class="modal-btns">
        <button class="btn-modal-cancel" id="deletePostCancel">취소</button>
        <button class="btn-modal-confirm" id="deletePostConfirm">확인</button>
      </div>
    </div>
  </div>

  <!-- 댓글 삭제 모달 (5-1) -->
  <div class="modal-overlay" id="deleteCommentModal">
    <div class="modal-box">
      <div class="modal-title">댓글을 삭제하시겠습니까?</div>
      <div class="modal-desc">삭제한 내용은 복구 할 수 없습니다.</div>
      <div class="modal-btns">
        <button class="btn-modal-cancel" id="deleteCommentCancel">취소</button>
        <button class="btn-modal-confirm" id="deleteCommentConfirm">확인</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="reportModal">
  <div class="modal-box">
    <div class="modal-title">게시글을 신고하시겠습니까?</div>
    <div class="modal-desc">신고된 게시글은 검토 후 처리됩니다.</div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" id="reportCancel">취소</button>
      <button class="btn-modal-confirm" id="reportConfirm">확인</button>
    </div>
  </div>
</div>

  <script src="../js/header.js" type="module"></script>
  <script src="../js/common.js" type="module"></script>
  <script src="../js/post_view.js" type="module"></script>
</body>
</html>
