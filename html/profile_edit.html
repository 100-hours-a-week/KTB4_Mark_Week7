<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원정보수정 - 아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/profile_edit.css">
</head>
<body>

  <!-- 헤더 -->
  <header class="header" style="position:relative;">
    <span class="header-title">아무 말 대잔치</span>
    <button id="profileBtn" style="
      position:absolute; right:475px;
      background:none; border:none; cursor:pointer;
      width:40px; height:40px; border-radius:50%;
      background-color:#C8C8C8; overflow:hidden; padding:0;
    ">
      <img id="profileImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
    </button>
    <!-- ① 드롭다운 -->
    <div class="profile-dropdown" id="profileDropdown">
      <button class="dropdown-item" id="goProfileEdit">회원정보수정</button>
      <button class="dropdown-item" id="goPasswordEdit">비밀번호수정</button>
      <button class="dropdown-item" id="goLogout">로그아웃</button>
    </div>
  </header>

  <main class="main">
    <div class="profile-edit-wrap">

      <h1 class="page-title">회원정보수정</h1>

      <!-- 프로필 사진 -->
      <div class="profile-section">
        <div class="field-label">프로필 사진<span class="required">*</span></div>
        <div class="profile-img-wrap">
          <div class="profile-circle-edit" id="profileUpload">
            <img src="" alt="" id="profilePreview" style="display:none;">
            <span class="profile-change-label">변경</span>
          </div>
        </div>
      </div>

      <!-- ② 이메일 + 닉네임 -->
      <div class="field" style="width:100%;">
        <div class="field-label">이메일</div>
        <div class="field-readonly" id="userEmail">startupcode@gmail.com</div>

        <div class="field-label" style="margin-top:10px;">닉네임</div>
        <input type="text" id="nickname" placeholder="닉네임을 입력해주세요." maxlength="10">
        <div class="helper-text" id="nicknameHelper"></div>
      </div>

      <!-- ③ 수정하기 버튼 -->
      <button class="btn-submit" id="submitBtn">수정하기</button>

      <!-- ④ 회원탈퇴 텍스트 버튼 -->
      <button class="btn-withdraw" id="withdrawBtn">회원 탈퇴</button>

    </div>
  </main>

  <!-- 4-1 회원탈퇴 확인 모달 -->
  <div class="modal-overlay" id="withdrawModal">
    <div class="modal-box">
      <div class="modal-title">회원탈퇴 하시겠습니까?</div>
      <div class="modal-desc">작성된 게시글과 댓글은 삭제됩니다.</div>
      <div class="modal-btns">
        <button class="btn-modal-cancel" id="withdrawCancel">취소</button>
        <button class="btn-modal-confirm" id="withdrawConfirm">확인</button>
      </div>
    </div>
  </div>

  <script src="../js/common.js" type="module"></script>
  <script src="../js/profile_edit.js" type="module"></script>
</body>
</html>
