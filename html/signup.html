<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 아무 말 대잔치</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
  <!-- 헤더: 화살표 왼쪽 독립, 타이틀 정중앙 -->
  <header class="header header-with-back">
    <button class="back-btn" id="backBtn">&#10094;</button>
    <span class="header-title">아무 말 대잔치</span>
  </header>

  <main class="main">
    <h1 class="page-title">회원가입</h1>
    <!-- 프로필 사진: 400 x 206 -->
    <div class="card profile-card">
      <div class="profile-label">프로필 사진</div>
      <div class="profile-helper" id="profileUploadHelper">*프로필 사진을 추가해주세요</div>
      <div class="profile-wrap">
      <label for="profileUpload">
        <div class="profile-circle">
          <img id="profilePreview" src="" alt="">
        </div>
      </label>
        <input type="file" id="profileUpload" accept="image/*" style="display:none;">
      </div>
    </div>

    <!-- 폼: 392 x 406 -->
    <div class="card form-card">
      <div class="field">
        <div class="field-label">이메일<span class="required">*</span></div>
        <input type="email" id="email" placeholder="이메일을 입력하세요">
        <div class="helper-text" id="emailHelper"></div>
      </div>

      <div class="field">
        <div class="field-label">비밀번호<span class="required">*</span></div>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요" minlength="8" maxlength="20">
        <div class="helper-text" id="passwordHelper"></div>
      </div>

      <div class="field">
        <div class="field-label">비밀번호 확인<span class="required">*</span></div>
        <input type="password" id="passwordConfirm" placeholder="비밀번호를 한번 더 입력하세요">
        <div class="helper-text" id="passwordConfirmHelper"></div>
      </div>

      <div class="field">
        <div class="field-label">닉네임<span class="required">*</span></div>
        <input type="text" id="nickname" placeholder="닉네임을 입력하세요" maxlength="10">
        <div class="helper-text" id="nicknameHelper"></div>
      </div>

      <button class="btn-primary" id="submitBtn" disabled>회원가입</button>
    </div>

    <!-- 로그인하러 가기: 346 x 42 -->
    <div class="card login-link-card">
      <button class="btn-text" id="goLogin">로그인하러 가기</button>
    </div>

  </main>
  <script src="../js/singup.js" type="module"></script>
</body>
</html>
